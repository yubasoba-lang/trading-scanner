<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Scanner</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d1117;--card:#161b22;--border:#30363d;--border2:#21262d;
    --green:#3fb950;--red:#f85149;--gold:#d4a843;--blue:#58a6ff;
    --text:#e6edf3;--dim:#7d8590;--dim2:#484f58;
    --card2:#1c2128;--hover:#1f2937;
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  /* TOP BAR */
  #topbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
  #topbar .logo{font-weight:700;font-size:14px;color:var(--gold);letter-spacing:1px;margin-right:8px}
  .ticker-tabs{display:flex;gap:2px;flex:1}
  .ticker-tab{padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim);transition:all .15s;white-space:nowrap}
  .ticker-tab:hover{background:var(--hover);color:var(--text)}
  .ticker-tab.active{background:var(--border2);color:var(--text)}
  .ticker-tab .chg{font-size:10px;margin-left:4px}
  .ticker-tab .chg.up{color:var(--green)}
  .ticker-tab .chg.dn{color:var(--red)}
  #acct-toggle{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;border:1px solid var(--border)}
  .acct-btn{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--dim);transition:all .15s}
  .acct-btn.active{background:var(--card2);color:var(--text)}
  #market-status{font-size:11px;color:var(--dim);white-space:nowrap}
  /* MAIN LAYOUT */
  #main{display:flex;flex:1;overflow:hidden}
  /* LEFT SIDEBAR */
  #sidebar{width:200px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
  .sidebar-section{padding:10px 12px;border-bottom:1px solid var(--border2)}
  .sidebar-label{font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:8px;font-weight:600}
  .acct-card{padding:10px 12px;border-bottom:1px solid var(--border2)}
  .acct-name{font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:4px}
  .acct-val{font-size:18px;font-weight:700}
  .acct-pnl{font-size:11px;margin-top:2px}
  .acct-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
  .stat-box{background:var(--bg);border-radius:6px;padding:6px 8px}
  .stat-label{font-size:9px;color:var(--dim);letter-spacing:1px}
  .stat-val{font-size:13px;font-weight:700;margin-top:1px}
  .watchlist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background .1s}
  .watchlist-row:hover{background:var(--hover)}
  .watchlist-row.active{background:var(--border2)}
  .wl-ticker{font-weight:700;font-size:12px}
  .wl-price{font-size:12px}
  .wl-chg{font-size:10px}
  /* CENTER CHART */
  #center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  #chart-header{padding:10px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:16px;flex-shrink:0}
  #chart-ticker{font-size:20px;font-weight:700}
  #chart-price{font-size:18px;font-weight:600}
  #chart-change{font-size:13px}
  #chart-ohlc{font-size:11px;color:var(--dim);margin-left:auto}
  .res-btns{display:flex;gap:2px}
  .res-btn{padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--dim);transition:all .1s}
  .res-btn:hover{color:var(--text)}
  .res-btn.active{background:var(--border2);color:var(--text)}
  #chart-container{flex:1;position:relative}
  #chart{width:100%;height:100%}
  #chart-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;pointer-events:none;display:none}
  /* BOTTOM PANEL */
  #bottom{height:220px;border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  #bottom-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0}
  .bottom-tab{padding:8px 16px;cursor:pointer;font-size:12px;color:var(--dim);border-bottom:2px solid transparent;transition:all .1s}
  .bottom-tab.active{color:var(--text);border-bottom-color:var(--blue)}
  #bottom-content{flex:1;overflow-y:auto;padding:0}
  table{width:100%;border-collapse:collapse}
  th{padding:6px 12px;text-align:left;font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:500;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--card);z-index:1}
  td{padding:7px 12px;font-size:12px;border-bottom:1px solid var(--border2)}
  tr:hover td{background:var(--hover)}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge.open{background:#1f3a5f;color:var(--blue)}
  .badge.target_hit{background:#1a3a2a;color:var(--green)}
  .badge.stopped_out{background:#3a1a1a;color:var(--red)}
  .badge.buy{background:#1a3a2a;color:var(--green)}
  .badge.skip{background:#3a1a1a;color:var(--red)}
  .badge.watch{background:#3a3010;color:var(--gold)}
  /* RIGHT PANEL - SIGNALS */
  #right{width:260px;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
  .right-header{padding:10px 12px;border-bottom:1px solid var(--border2);font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:600;flex-shrink:0}
  .signal-card{padding:12px;border-bottom:1px solid var(--border2)}
  .signal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .signal-ticker{font-size:15px;font-weight:700}
  .signal-score{font-size:10px;padding:2px 8px;border-radius:10px;background:#1a3a2a;color:var(--green);font-weight:600}
  .signal-score.neutral{background:#21262d;color:var(--dim)}
  .levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px}
  .level{background:var(--bg);border-radius:5px;padding:5px 6px}
  .level-label{font-size:9px;color:var(--dim);letter-spacing:1px}
  .level-val{font-size:11px;font-weight:700;margin-top:1px}
  .dec-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}
  .dec-btn{padding:5px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;text-align:center;border:1px solid var(--border);color:var(--dim);background:var(--bg);transition:all .1s}
  .dec-btn:hover{border-color:var(--dim)}
  .dec-btn.buy.active{background:#1a3a2a;border-color:var(--green);color:var(--green)}
  .dec-btn.skip.active{background:#3a1a1a;border-color:var(--red);color:var(--red)}
  .dec-btn.watch.active{background:#3a3010;border-color:var(--gold);color:var(--gold)}
  #save-btn{margin:12px;padding:9px;background:var(--gold);color:#000;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;text-align:center;letter-spacing:1px;flex-shrink:0}
  #save-btn:hover{opacity:.9}
  #save-status{text-align:center;font-size:11px;color:var(--dim);margin:-6px 12px 8px;min-height:16px}
  /* Compare chart */
  #compare-chart{width:100%;height:160px}
  .empty{padding:24px;text-align:center;color:var(--dim)}
  .up{color:var(--green)}
  .dn{color:var(--red)}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">◈ SCANNER</div>
  <div class="ticker-tabs" id="ticker-tabs"></div>
  <div id="acct-toggle">
    <div class="acct-btn active" onclick="setView('system')">System</div>
    <div class="acct-btn" onclick="setView('you')">You</div>
    <div class="acct-btn" onclick="setView('compare')">Compare</div>
  </div>
  <div id="market-status">Loading...</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div class="acct-card" id="sys-acct-card">
      <div class="acct-name">SYSTEM ACCOUNT</div>
      <div class="acct-val" id="sys-val">¥60,000</div>
      <div class="acct-pnl" id="sys-pnl">+¥0 (0.00%)</div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px" id="sys-cash">¥60,000 cash</div>
      <div class="acct-stats">
        <div class="stat-box"><div class="stat-label">WIN RATE</div><div class="stat-val" id="sys-wr">—</div></div>
        <div class="stat-box"><div class="stat-label">TRADES</div><div class="stat-val" id="sys-trades">0</div></div>
        <div class="stat-box"><div class="stat-label">WINS</div><div class="stat-val up" id="sys-wins">0</div></div>
        <div class="stat-box"><div class="stat-label">LOSSES</div><div class="stat-val dn" id="sys-losses">0</div></div>
      </div>
    </div>
    <div class="acct-card" id="you-acct-card">
      <div class="acct-name">YOUR ACCOUNT</div>
      <div class="acct-val" id="you-val">¥60,000</div>
      <div class="acct-pnl" id="you-pnl">+¥0 (0.00%)</div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px" id="you-cash">¥60,000 cash</div>
      <div class="acct-stats">
        <div class="stat-box"><div class="stat-label">WIN RATE</div><div class="stat-val" id="you-wr">—</div></div>
        <div class="stat-box"><div class="stat-label">TRADES</div><div class="stat-val" id="you-trades">0</div></div>
        <div class="stat-box"><div class="stat-label">WINS</div><div class="stat-val up" id="you-wins">0</div></div>
        <div class="stat-box"><div class="stat-label">LOSSES</div><div class="stat-val dn" id="you-losses">0</div></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">WATCHLIST</div>
      <div id="watchlist"></div>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="chart-header">
      <div id="chart-ticker">—</div>
      <div id="chart-price">—</div>
      <div id="chart-change">—</div>
      <div class="res-btns">
        <div class="res-btn active" onclick="setRes('D',this)">1D</div>
        <div class="res-btn" onclick="setRes('W',this)">1W</div>
        <div class="res-btn" onclick="setRes('M',this)">1M</div>
      </div>
      <div id="chart-ohlc"></div>
    </div>
    <div id="chart-container">
      <div id="chart"></div>
    </div>
    <!-- BOTTOM PANEL -->
    <div id="bottom">
      <div id="bottom-tabs">
        <div class="bottom-tab active" onclick="setTab('open',this)">Open Trades</div>
        <div class="bottom-tab" onclick="setTab('history',this)">History</div>
        <div class="bottom-tab" onclick="setTab('compare',this)">P&amp;L Chart</div>
      </div>
      <div id="bottom-content"></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">
    <div class="right-header">TODAY'S SIGNALS</div>
    <div id="signals-list"></div>
    <div id="save-btn" onclick="saveDecisions()">SAVE DECISIONS</div>
    <div id="save-status"></div>
  </div>

</div>

<script>
const FINNHUB_KEY = 'd8tb609r01qhcnk1e3v0d8tb609r01qhcnk1e3vg';
const TRADES_URL = 'https://raw.githubusercontent.com/yubasoba-lang/trading-scanner/main/paper_trades.json';
const WATCHLIST = ['AAPL','NVDA','TSLA','MSFT','SPY','META','AMZN','MRNA'];
const STARTING_JPY = 60000;
const USD_JPY = 155;
const STARTING_USD = STARTING_JPY / USD_JPY;

let trades = [];
let decisions = JSON.parse(localStorage.getItem('trading_decisions') || '{}');
let currentTicker = 'NVDA';
let currentRes = 'D';
let currentView = 'system';
let currentTab = 'open';
let chart, candleSeries, volumeSeries, compareLine;
let prices = {};

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  buildTickerTabs();
  initChart();
  await Promise.all([loadTrades(), fetchAllPrices()]);
  updateSidebar();
  renderSignals();
  renderTab();
  loadCandles(currentTicker, currentRes);
  updateMarketStatus();
}

// ── Chart ─────────────────────────────────────────────────────────────
function initChart() {
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0d1117' }, textColor: '#7d8590' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#30363d' },
    timeScale: { borderColor: '#30363d', timeVisible: true },
    handleScroll: true,
    handleScale: true,
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#3fb950', downColor: '#f85149',
    borderUpColor: '#3fb950', borderDownColor: '#f85149',
    wickUpColor: '#3fb950', wickDownColor: '#f85149',
  });

  volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'volume',
    scaleMargins: { top: 0.8, bottom: 0 },
  });

  chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

  chart.subscribeCrosshairMove(param => {
    if (!param.time || !candleSeries) return;
    const data = param.seriesData.get(candleSeries);
    if (data) {
      document.getElementById('chart-ohlc').textContent =
        `O ${data.open.toFixed(2)}  H ${data.high.toFixed(2)}  L ${data.low.toFixed(2)}  C ${data.close.toFixed(2)}`;
    }
  });

  new ResizeObserver(() => {
    const el = document.getElementById('chart-container');
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  }).observe(document.getElementById('chart-container'));
}

async function loadCandles(ticker, resolution) {
  document.getElementById('chart-ticker').textContent = ticker;
  document.getElementById('chart-price').textContent = '...';
  const rangeMap = { 'D': '6mo', 'W': '1y', 'M': '2y' };
  const intervalMap = { 'D': '1d', 'W': '1wk', 'M': '1mo' };
  const range = rangeMap[resolution];
  const interval = intervalMap[resolution];
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=${range}&interval=${interval}&includePrePost=false`;
    const res = await fetch(url);
    const json = await res.json();
    const result = json.chart.result[0];
    const timestamps = result.timestamp;
    const ohlcv = result.indicators.quote[0];

    const candles = timestamps.map((t, i) => ({
      time: t,
      open: +ohlcv.open[i].toFixed(2),
      high: +ohlcv.high[i].toFixed(2),
      low: +ohlcv.low[i].toFixed(2),
      close: +ohlcv.close[i].toFixed(2),
    })).filter(c => c.open && c.high && c.low && c.close);

    const vols = timestamps.map((t, i) => ({
      time: t,
      value: ohlcv.volume[i] || 0,
      color: (ohlcv.close[i] >= ohlcv.open[i]) ? '#3fb95044' : '#f8514944'
    })).filter(v => v.value);

    candleSeries.setData(candles);
    volumeSeries.setData(vols);
    drawTradeLevels(ticker);
    chart.timeScale().fitContent();

    const last = candles[candles.length - 1];
    const prev = candles[candles.length - 2];
    const chg = last.close - prev.close;
    const chgPct = (chg / prev.close * 100).toFixed(2);
    document.getElementById('chart-price').textContent = `$${last.close.toFixed(2)}`;
    const chgEl = document.getElementById('chart-change');
    chgEl.textContent = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)} (${chg >= 0 ? '+' : ''}${chgPct}%)`;
    chgEl.className = chg >= 0 ? 'up' : 'dn';
    prices[ticker] = last.close;
    updateWatchlistRow(ticker, last.close, chgPct);
  } catch(e) {
    console.error('Chart load error:', e);
    document.getElementById('chart-price').textContent = 'Error loading';
  }
}

function drawTradeLevels(ticker) {
  // Remove existing price lines
  try { candleSeries.priceLines().forEach(l => candleSeries.removePriceLine(l)); } catch(e) {}
  const open = trades.filter(t => t.ticker === ticker && t.status === 'open');
  open.forEach(t => {
    candleSeries.createPriceLine({ price: t.entry_price, color: '#58a6ff', lineWidth: 1, lineStyle: 2, title: 'Entry' });
    candleSeries.createPriceLine({ price: t.sl, color: '#f85149', lineWidth: 1, lineStyle: 2, title: 'SL' });
    candleSeries.createPriceLine({ price: t.tp, color: '#3fb950', lineWidth: 1, lineStyle: 2, title: 'TP' });
  });
}

function setRes(res, el) {
  currentRes = res;
  document.querySelectorAll('.res-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadCandles(currentTicker, res);
}

// ── Ticker tabs ───────────────────────────────────────────────────────
function buildTickerTabs() {
  const container = document.getElementById('ticker-tabs');
  container.innerHTML = WATCHLIST.map(t => `
    <div class="ticker-tab${t === currentTicker ? ' active' : ''}" id="tab-${t}" onclick="selectTicker('${t}')">
      ${t} <span class="chg" id="chg-${t}"></span>
    </div>`).join('');
  const wl = document.getElementById('watchlist');
  wl.innerHTML = WATCHLIST.map(t => `
    <div class="watchlist-row${t === currentTicker ? ' active' : ''}" id="wlrow-${t}" onclick="selectTicker('${t}')">
      <div><div class="wl-ticker">${t}</div><div class="wl-chg" id="wlchg-${t}">—</div></div>
      <div class="wl-price" id="wlprice-${t}">—</div>
    </div>`).join('');
}

function selectTicker(ticker) {
  currentTicker = ticker;
  document.querySelectorAll('.ticker-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.watchlist-row').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + ticker)?.classList.add('active');
  document.getElementById('wlrow-' + ticker)?.classList.add('active');
  loadCandles(ticker, currentRes);
}

function updateWatchlistRow(ticker, price, chgPct) {
  const priceEl = document.getElementById('wlprice-' + ticker);
  const chgEl = document.getElementById('wlchg-' + ticker);
  const tabChg = document.getElementById('chg-' + ticker);
  if (priceEl) priceEl.textContent = '$' + price.toFixed(2);
  if (chgEl) {
    chgEl.textContent = `${chgPct >= 0 ? '+' : ''}${chgPct}%`;
    chgEl.className = 'wl-chg ' + (chgPct >= 0 ? 'up' : 'dn');
  }
  if (tabChg) {
    tabChg.textContent = `${chgPct >= 0 ? '+' : ''}${chgPct}%`;
    tabChg.className = 'chg ' + (chgPct >= 0 ? 'up' : 'dn');
  }
}

// ── Data ──────────────────────────────────────────────────────────────
async function loadTrades() {
  try {
    const res = await fetch(TRADES_URL + '?t=' + Date.now());
    trades = await res.json();
  } catch(e) { trades = []; }
}

async function fetchAllPrices() {
  await Promise.all(WATCHLIST.map(async ticker => {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
      const d = await res.json();
      if (d.c) {
        prices[ticker] = d.c;
        const chgPct = ((d.c - d.pc) / d.pc * 100).toFixed(2);
        updateWatchlistRow(ticker, d.c, chgPct);
      }
    } catch(e) {}
  }));
}

// ── Account stats ─────────────────────────────────────────────────────
function calcAccount(filterFn) {
  const myTrades = trades.filter(filterFn);
  const open = myTrades.filter(t => t.status === 'open');
  const closed = myTrades.filter(t => t.status !== 'open');
  const wins = closed.filter(t => t.status === 'target_hit');
  const losses = closed.filter(t => t.status === 'stopped_out');

  // Position size per trade: risk 5% of account / sl%
  const RISK_PCT = 0.05;
  function positionUSD(t) {
    const riskUSD = STARTING_USD * RISK_PCT;
    return riskUSD / (Math.abs(t.sl_pct) / 100);
  }

  // Cash = starting - invested in open trades + realized P&L from closed
  let investedUSD = 0;
  open.forEach(t => { investedUSD += positionUSD(t); });

  let realizedPnlUSD = 0;
  closed.forEach(t => {
    const pos = positionUSD(t);
    realizedPnlUSD += pos * (t.result_pct / 100);
  });

  // Unrealized P&L from open trades using live prices
  let unrealizedPnlUSD = 0;
  open.forEach(t => {
    const price = prices[t.ticker];
    if (price) {
      const pct = (price - t.entry_price) / t.entry_price * 100;
      unrealizedPnlUSD += positionUSD(t) * (pct / 100);
    }
  });

  const cashUSD = STARTING_USD - investedUSD + realizedPnlUSD;
  const totalUSD = cashUSD + investedUSD + unrealizedPnlUSD;
  const cashJPY = Math.round(cashUSD * USD_JPY);
  const totalJPY = Math.round(totalUSD * USD_JPY);
  const pnlJPY = totalJPY - STARTING_JPY;
  const pnlPct = ((totalUSD - STARTING_USD) / STARTING_USD * 100).toFixed(2);
  const wr = closed.length ? Math.round(wins.length / closed.length * 100) : null;

  return { cashJPY, totalJPY, pnlJPY, pnlPct, wins: wins.length, losses: losses.length, total: myTrades.length, wr, trades: myTrades };
}

function updateSidebar() {
  const sys = calcAccount(t => true);
  const you = calcAccount(t => decisions[t.id]?.decision === 'Buy');

  function renderAcct(prefix, stats) {
    const pnlSign = stats.pnlJPY >= 0 ? '+' : '';
    document.getElementById(prefix+'-val').textContent = `¥${stats.totalJPY.toLocaleString()}`;
    const pnlEl = document.getElementById(prefix+'-pnl');
    pnlEl.textContent = `${pnlSign}¥${stats.pnlJPY.toLocaleString()} (${pnlSign}${stats.pnlPct}%)`;
    pnlEl.className = 'acct-pnl ' + (stats.pnlJPY >= 0 ? 'up' : 'dn');
    document.getElementById(prefix+'-cash').textContent = `¥${stats.cashJPY.toLocaleString()} cash`;
    document.getElementById(prefix+'-wr').textContent = stats.wr !== null ? stats.wr + '%' : '—';
    document.getElementById(prefix+'-trades').textContent = stats.total;
    document.getElementById(prefix+'-wins').textContent = stats.wins;
    document.getElementById(prefix+'-losses').textContent = stats.losses;
  }
  renderAcct('sys', sys);
  renderAcct('you', you);
}

// ── Signals panel ─────────────────────────────────────────────────────
function renderSignals() {
  const today = new Date().toISOString().slice(0, 10);
  const todayTrades = trades.filter(t => t.date === today);
  const container = document.getElementById('signals-list');

  if (!todayTrades.length) {
    container.innerHTML = '<div class="empty">No signals today.<br>Scanner runs 7am HU time.</div>';
    return;
  }

  container.innerHTML = todayTrades.map(t => {
    const dec = decisions[t.id]?.decision;
    return `
    <div class="signal-card">
      <div class="signal-top">
        <div class="signal-ticker" onclick="selectTicker('${t.ticker}')" style="cursor:pointer">${t.ticker}</div>
        <div class="signal-score">${t.score}/100</div>
      </div>
      <div class="levels">
        <div class="level"><div class="level-label">ENTRY</div><div class="level-val">$${t.entry_price}</div></div>
        <div class="level"><div class="level-label">SL</div><div class="level-val dn">$${t.sl}</div></div>
        <div class="level"><div class="level-label">TP</div><div class="level-val up">$${t.tp}</div></div>
      </div>
      <div style="display:flex;gap:6px;font-size:10px;color:var(--dim);margin-bottom:6px">
        <span>ATR ${t.atr_pct}%</span>
        <span>·</span>
        <span>R/R 1:${(t.tp_pct / Math.abs(t.sl_pct)).toFixed(1)}</span>
        ${t.earnings_warning ? '<span style="color:var(--gold)">· ⚠ Earnings</span>' : ''}
      </div>
      <div class="dec-btns">
        <div class="dec-btn buy ${dec==='Buy'?'active':''}" onclick="setDec(${t.id},'Buy',this)">Buy</div>
        <div class="dec-btn skip ${dec==='Skip'?'active':''}" onclick="setDec(${t.id},'Skip',this)">Skip</div>
        <div class="dec-btn watch ${dec==='Watch'?'active':''}" onclick="setDec(${t.id},'Watch',this)">Watch</div>
      </div>
    </div>`;
  }).join('');
}

function setDec(id, decision, btn) {
  const card = btn.closest('.signal-card');
  card.querySelectorAll('.dec-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!decisions[id]) decisions[id] = {};
  decisions[id].decision = decision;
}

function saveDecisions() {
  localStorage.setItem('trading_decisions', JSON.stringify(decisions));
  updateSidebar();
  renderTab();
  const status = document.getElementById('save-status');
  status.textContent = 'Saved ✓';
  setTimeout(() => status.textContent = '', 2000);
}

// ── Bottom tabs ───────────────────────────────────────────────────────
function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('bottom-content');
  if (currentTab === 'open') renderOpenTrades(el);
  else if (currentTab === 'history') renderHistory(el);
  else renderCompareChart(el);
}

function renderOpenTrades(el) {
  const open = trades.filter(t => t.status === 'open');
  if (!open.length) { el.innerHTML = '<div class="empty">No open trades</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>TICKER</th><th>DATE</th><th>ENTRY</th><th>SL</th><th>TP</th><th>ATR%</th><th>SCORE</th><th>YOUR CALL</th></tr></thead>
    <tbody>${open.map(t => {
      const dec = decisions[t.id]?.decision;
      const price = prices[t.ticker];
      const unrealized = price ? ((price - t.entry_price) / t.entry_price * 100).toFixed(1) : null;
      return `<tr onclick="selectTicker('${t.ticker}')" style="cursor:pointer">
        <td><b>${t.ticker}</b></td>
        <td>${t.date}</td>
        <td>$${t.entry_price}</td>
        <td class="dn">$${t.sl} (${t.sl_pct}%)</td>
        <td class="up">$${t.tp} (+${t.tp_pct}%)</td>
        <td>${t.atr_pct}%</td>
        <td>${t.score}/100</td>
        <td>${dec ? `<span class="badge ${dec.toLowerCase()}">${dec}</span>` : '<span style="color:var(--dim)">—</span>'}
        ${unrealized !== null ? `<span style="margin-left:6px;font-size:10px" class="${unrealized >= 0 ? 'up':'dn'}">${unrealized >= 0?'+':''}${unrealized}% now</span>` : ''}
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderHistory(el) {
  const closed = trades.filter(t => t.status !== 'open').slice().reverse();
  if (!closed.length) { el.innerHTML = '<div class="empty">No closed trades yet</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>TICKER</th><th>DATE</th><th>ENTRY</th><th>EXIT</th><th>RESULT</th><th>STATUS</th><th>YOUR CALL</th></tr></thead>
    <tbody>${closed.map(t => {
      const dec = decisions[t.id]?.decision;
      return `<tr>
        <td><b>${t.ticker}</b></td>
        <td>${t.date}</td>
        <td>$${t.entry_price}</td>
        <td>$${t.exit_price || '—'}</td>
        <td class="${t.result_pct >= 0 ? 'up':'dn'}">${t.result_pct >= 0?'+':''}${t.result_pct}%</td>
        <td><span class="badge ${t.status}">${t.status === 'target_hit' ? '✓ Target' : '✗ Stopped'}</span></td>
        <td>${dec ? `<span class="badge ${dec.toLowerCase()}">${dec}</span>` : '<span style="color:var(--dim)">—</span>'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderCompareChart(el) {
  el.innerHTML = '<canvas id="compare-canvas" style="width:100%;height:100%"></canvas>';
  const closed = trades.filter(t => t.status !== 'open').sort((a,b) => a.date.localeCompare(b.date));
  if (closed.length < 2) { el.innerHTML = '<div class="empty">Need at least 2 closed trades to compare</div>'; return; }

  const canvas = document.getElementById('compare-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = el.clientWidth;
  canvas.height = el.clientHeight;
  const W = canvas.width, H = canvas.height;
  const pad = { t: 20, r: 20, b: 30, l: 50 };

  // Build cumulative P&L series
  let sysPnl = 0, youPnl = 0;
  const sysPoints = [0], youPoints = [0];
  const labels = ['Start'];

  closed.forEach(t => {
    sysPnl += t.result_pct || 0;
    sysPoints.push(sysPnl);
    if (decisions[t.id]?.decision === 'Buy') youPnl += t.result_pct || 0;
    youPoints.push(youPnl);
    labels.push(t.ticker + ' ' + t.date.slice(5));
  });

  const allVals = [...sysPoints, ...youPoints];
  const minV = Math.min(...allVals) - 1;
  const maxV = Math.max(...allVals) + 1;
  const rangeV = maxV - minV || 1;

  function toX(i) { return pad.l + (i / (sysPoints.length - 1)) * (W - pad.l - pad.r); }
  function toY(v) { return pad.t + (1 - (v - minV) / rangeV) * (H - pad.t - pad.b); }

  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(pct => {
    const v = minV + (pct/100) * rangeV;
    const y = toY(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#7d8590'; ctx.font = '10px sans-serif';
    ctx.fillText(v.toFixed(1) + '%', 4, y + 3);
  });

  // Zero line
  if (minV < 0 && maxV > 0) {
    ctx.strokeStyle = '#484f58'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    const y0 = toY(0);
    ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(W - pad.r, y0); ctx.stroke();
    ctx.setLineDash([]);
  }

  // System line
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  sysPoints.forEach((v, i) => i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)));
  ctx.stroke();

  // You line
  ctx.strokeStyle = '#d4a843'; ctx.lineWidth = 2;
  ctx.beginPath();
  youPoints.forEach((v, i) => i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)));
  ctx.stroke();

  // Legend
  ctx.fillStyle = '#58a6ff'; ctx.fillRect(W - 110, 8, 12, 3);
  ctx.fillStyle = '#e6edf3'; ctx.font = '11px sans-serif'; ctx.fillText('System', W - 94, 14);
  ctx.fillStyle = '#d4a843'; ctx.fillRect(W - 110, 22, 12, 3);
  ctx.fillStyle = '#e6edf3'; ctx.fillText('You', W - 94, 28);
}

// ── View toggle ───────────────────────────────────────────────────────
function setView(view) {
  currentView = view;
  document.querySelectorAll('.acct-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

// ── Market status ──────────────────────────────────────────────────────
function updateMarketStatus() {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = et.getDay();
  const h = et.getHours(), m = et.getMinutes();
  const mins = h * 60 + m;
  const el = document.getElementById('market-status');
  if (day === 0 || day === 6) {
    el.innerHTML = '<span style="color:var(--dim)">● Market closed (weekend)</span>';
  } else if (mins >= 570 && mins < 960) {
    el.innerHTML = '<span style="color:var(--green)">● Market open</span>';
  } else if (mins >= 960) {
    el.innerHTML = '<span style="color:var(--dim)">● Market closed</span>';
  } else {
    const openIn = 570 - mins;
    el.innerHTML = `<span style="color:var(--gold)">● Opens in ${Math.floor(openIn/60)}h ${openIn%60}m ET</span>`;
  }
}

init();
</script>
