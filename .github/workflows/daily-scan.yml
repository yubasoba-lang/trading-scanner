name: Daily Trading Scan

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 1pm Budapest time (UTC+2), Monday–Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance ta anthropic requests

      - name: Run scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scanner.py

      - name: Commit updated trade log
        run: |
          git config user.name "Trading Bot"
          git config user.email "yuva.y.ajeesh@gmail.com"
          git add paper_trades.json
          git diff --staged --quiet || git commit -m "Update paper trades $(date +%Y-%m-%d)"
          git push
